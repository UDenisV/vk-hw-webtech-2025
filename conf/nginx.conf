worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    gzip on;

    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m use_temp_path=off;

    upstream app_server {
        server 127.0.0.1:8000;
    }

    server {
        listen       80;
        server_name  localhost;

        location /uploads/ {
            alias C:/Users/denis/PycharmProjects/vk-hw-webtech-2025/ask_denis/uploads/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public";
        }

        # Static files
        location /static/ {
            alias C:/Users/denis/PycharmProjects/vk-hw-webtech-2025/ask_denis/static/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public";
        }

        location / {
            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache my_cache;
            proxy_cache_valid 200 1m;
            proxy_cache_use_stale error timeout updating;
        }
    }
}
